# Ingestão agendada dos dados do IBGE.
#
# Commita **apenas quando o dado muda**. O Censo é de 2022 e o PIB é anual, então
# a maior parte das execuções não vai produzir commit nenhum — e isso é o
# comportamento certo, não uma falha. Commit vazio semanal seria atividade
# fabricada, que é exatamente o que este projeto não faz.
#
# **E isto foi mentira até 21/09/2026.** Três execuções, três commits, três
# deploys, sem um único valor mudar: o `git diff --quiet` lá embaixo compara o
# ARQUIVO, e o arquivo sempre difere porque `geradoEm` e os treze `coletadoEm`
# são carimbos de hora. Custava ~1 GB de Deployment Storage por semana, num
# limite sem expiração que já bateu 100%.
#
# Quem cumpre a promessa agora é a **trava do carimbo**, dentro do `exportar`:
# ele compara o dado ignorando os carimbos e **não reescreve o arquivo** quando
# nada mudou. O `git diff` abaixo continua, e passou a funcionar como sempre
# se anunciou — mas ele é a segunda linha, não a primeira.
#
# *Guarda de artefato mora onde o artefato é escrito.* Aqui ela vale também
# para o `atualizar-painel.py` e para quem rodar o comando à mão.

name: Atualizar dados do IBGE

on:
  schedule:
    # Segunda-feira, 09:00 UTC (06:00 em São Paulo). Semanal, porque dado anual
    # não muda mais rápido que isso e cada execução são ~36 requisições à API.
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  # Para pedir a publicação (`gh workflow run`) quando o dado muda.
  actions: write

concurrency:
  group: ingestao
  cancel-in-progress: false

jobs:
  ingerir:
    runs-on: ubuntu-latest
    outputs:
      commitou: ${{ steps.commit.outputs.commitou }}
    # 40 e não 20: com os treze indicadores do registro são ~13 × 27 = 351
    # requisições a `--pausa 2`, mais as 27 dos municípios — perto de 13
    # minutos só de espera deliberada. O teto antigo foi dimensionado para
    # três indicadores e cortaria a coleta no meio, que é o modo de falhar
    # que este arquivo inteiro existe para evitar.
    #
    # 90 desde 29/09/2026, quando o registro foi de 13 para 26 indicadores. A
    # coleta de 28/09, com 13, levou 19 min 23 s só no passo de ingestão; o
    # dobro encosta nos 40, e o teto cortaria a coleta no meio sem que nada
    # no código tivesse mudado de comportamento. **Ao crescer o registro,
    # reler este número** -- é a mesma lição dos três indicadores de 14/09.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Sem `pip install`: o motor usa só a biblioteca padrão.

      - name: Testes
        run: python -m unittest discover -s tests -t .

      # `--regiao BR` EXPLÍCITO, e não herdado do padrão.
      #
      # Em 07/09/2026 este passo rodou sem a bandeira. O padrão ainda era `NE`,
      # sobra da época em que o site era regional: reingeriu 1.794 municípios
      # por cima de 5.571, commitou, e a Vercel publicou um site que devolvia
      # 404 em 3.777 páginas de município e 18 de estado.
      #
      # O padrão virou `BR` no mesmo dia, então esta linha é redundante hoje —
      # e é justamente por isso que ela fica. Processo automático não deve
      # depender de um padrão que alguém pode reabrir: quem digita à mão vê o
      # efeito na hora, o cron vê na segunda-feira seguinte.
      #
      # `todos` em vez dos três nomes, e isto é a correção de 15/09/2026.
      #
      # Este passo nomeava três indicadores, copiados à mão quando o site tinha
      # três. Em 04 e 05/09 entraram mais dez, do Censo 2022, e ninguém voltou
      # aqui. Em **14/09 o cron publicou um snapshot com 3 indicadores por cima
      # de um com 13**: o runner faz checkout limpo, `observatorio.db` está no
      # `.gitignore`, e o `exportar` retratou fielmente o banco que ESTE passo
      # encheu. A seção "Como se vive" saiu das 5.571 páginas, e as planilhas
      # de download perderam dez colunas.
      #
      # `conferir` liberou: ele soma os indicadores que EXISTEM contra o
      # agregado do IBGE, e os três estavam certos. **Verificação que só olha
      # o que está presente não vê o que falta.**
      #
      # Com `todos`, a lista sai do registro `INDICADORES` e não pode mais
      # ficar para trás. É a mesma lição da bandeira acima, do outro lado:
      # lá o automático herdava um padrão velho, aqui carregava uma cópia.
      - name: Ingerir municípios e TODOS os indicadores do registro
        run: |
          python -m numeros_publicos ingerir-municipios --regiao BR --pausa 2
          python -m numeros_publicos ingerir-indicador todos --regiao BR --pausa 2

      # Integridade contra a própria fonte. Sai com código 1 se a soma dos
      # municípios divergir do agregado regional do IBGE — e aí o workflow
      # falha ANTES de publicar número errado.
      # Também com a bandeira, e aqui ela é o ponto: em 07/09 este passo PASSOU
      # sobre a regressão. Herdando o mesmo padrão `NE`, somou o Nordeste e
      # comparou com o total do Nordeste. Bateu.
      #
      # **Verificação que herda o parâmetro daquilo que deveria verificar não
      # verifica nada** — ela confirma a premissa em vez de testá-la.
      - name: Conferir contra o agregado NACIONAL do IBGE
        run: python -m numeros_publicos conferir --regiao BR

      - name: Exportar o snapshot
        run: python -m numeros_publicos exportar

      - name: Commitar apenas se o dado mudou
        id: commit
        run: |
          if git diff --quiet -- painel/dados/snapshot.json; then
            echo "Nenhuma mudança no dado do IBGE. Nada a commitar."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add painel/dados/snapshot.json
          git commit -m "atualiza o snapshot do IBGE ($(date -u +%Y-%m-%d))"
          git push
          echo "commitou=true" >> "$GITHUB_OUTPUT"

  # Publica só quando a coleta commitou. Até 05/10/2026 o "Publicar na
  # Cloudflare" escutava o fim desta coleta (`workflow_run`) e republicava o
  # mesmo site toda segunda-feira, dado novo ou não (em 05/10, 9 min de
  # build para nada). Commit do GITHUB_TOKEN não dispara `push`, mas
  # `workflow_dispatch` disparado por ele dispara. E quem pede espera o
  # resultado: se a publicação cair, esta coleta fica vermelha, em vez de
  # verde com o dado fora do ar (stack.md, a lição do Caged de 30/09).
  publicar:
    needs: ingerir
    if: needs.ingerir.outputs.commitou == 'true'
    runs-on: ubuntu-latest
    # A publicação leva de 9 a 44 min e pode esperar outra na fila.
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Pedir a publicação e esperar o resultado
        run: |
          desde=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run publicar-cloudflare.yml --ref main
          id=
          for _ in $(seq 1 30); do
            id=$(gh run list --workflow publicar-cloudflare.yml --event workflow_dispatch \
                 --created ">=$desde" -L 1 --json databaseId -q '.[0].databaseId')
            [ -n "$id" ] && break
            sleep 10
          done
          if [ -z "$id" ]; then
            echo "::error::a publicação pedida não apareceu em 5 min"
            exit 1
          fi
          echo "Publicação: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$id"
          # Pelo estado, e não pelo `gh run watch --exit-status`, que já saiu
          # com 1 com o run ainda rodando (github.md, 09/10/2026). Com prazo
          # próprio, abaixo do `timeout-minutes` do job: job cancelado pelo
          # tempo não avisa ninguém, e falhar avisa.
          prazo=$((SECONDS + 105 * 60))
          while [ "$(gh run view "$id" --json status -q .status)" != "completed" ]; do
            if [ "$SECONDS" -ge "$prazo" ]; then
              echo "::error::a publicação não terminou em 105 min: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$id"
              exit 1
            fi
            sleep 60
          done
          conclusao=$(gh run view "$id" --json conclusion -q .conclusion)
          echo "Publicação terminou: $conclusao"
          [ "$conclusao" = "success" ]
