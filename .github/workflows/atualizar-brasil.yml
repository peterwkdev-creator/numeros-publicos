# Atualiza "O Brasil ao longo do tempo" (/brasil/) uma vez por semana.
# Escrito em 06/10/2026.
#
# ## O que ele faz, e por que quase nunca publica
#
# Lê cada série pelos dois caminhos da fonte (IBGE: API de agregados e
# SIDRA; Banco Central: a mesma série do SGS em dois recortes de datas; Ipea:
# o salário real contra o nominal e o INPC do SGS) e a meta de inflação (SGS
# 13521 e a tabela da página do BC). O `brasil-exportar` só reescreve o
# `brasil.json` quando um ponto mudou (carimbo de coleta não conta) e recusa
# encolher. As fontes publicam por mês, por trimestre ou por ano: na maioria
# das semanas o JSON fica igual e o job termina sem commit.
#
# ## Quando uma fonte falha (desde 07/10/2026)
#
# Cada série entra por si. A que falhar (fonte fora do ar, leituras que
# divergem) é tentada de novo no fim da coleta; se falhar outra vez,
# `brasil-ingerir` sai com 3, o `brasil.json` guarda o que já estava
# publicado dela (`--manter-ausentes`: o banco do runner começa vazio) e as
# outras seguem até a publicação. O job `avisar`, por último, fica vermelho
# com o motivo, para o GitHub mandar o aviso. Saída 1 (mandatos com defeito,
# nada lido) e série que encolheria continuam parando tudo.
#
# ## O que ele NÃO faz
#
# Não mexe na tabela de quem ocupou a Presidência (`brasil_mandatos.csv`): a
# troca de mandato se registra à mão, com a fonte oficial da data.
#
# ## Por que pede a publicação em vez de esperar o `push`
#
# Commit feito com o GITHUB_TOKEN não dispara `push`, mas `workflow_dispatch`
# disparado por ele dispara (a exceção documentada pelo GitHub), e quem pede
# espera o resultado: a mesma razão do workflow do Caged.
name: Atualizar O Brasil ao longo do tempo

on:
  schedule:
    # Quarta, 12:00 UTC (9:00 em Brasília): fora do horário do IBGE (segunda)
    # e do Caged (todo dia, 21:30).
    - cron: "0 12 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

# O mesmo grupo do IBGE e do Caged: os três commitam no main, e um não pode
# empurrar por cima do outro.
concurrency:
  group: ingestao
  cancel-in-progress: false

jobs:
  brasil:
    runs-on: ubuntu-latest
    outputs:
      commitou: ${{ steps.commit.outputs.commitou }}
      parcial: ${{ steps.ingerir.outputs.parcial }}
    # Folga larga: são poucas dezenas de pedidos, com pausa entre eles.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes
        run: python -m unittest discover -s tests -t .

      # O banco não é versionado: o runner começa limpo e lê tudo de novo,
      # o que também apanha correção que a fonte fez num ponto antigo.
      # Saída 3 é coleta parcial: o que bateu segue, e cada falha vira
      # anotação aqui e o vermelho do job `avisar`.
      - name: Ler as séries e a meta, cada uma por dois caminhos
        id: ingerir
        run: |
          set +e
          PYTHONUNBUFFERED=1 python -m numeros_publicos brasil-ingerir 2>&1 \
            | tee "$RUNNER_TEMP/ingerir.log"
          codigo=${PIPESTATUS[0]}
          set -e
          if [ "$codigo" = 3 ]; then
            grep '^\[falha\]' "$RUNNER_TEMP/ingerir.log" | sed 's/^/::error::/' || true
            echo "parcial=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$codigo"

      - name: Exportar o brasil.json
        run: python -m numeros_publicos brasil-exportar --manter-ausentes

      - name: Commitar apenas se o dado mudou
        id: commit
        run: |
          if git diff --quiet -- painel/dados/brasil.json; then
            echo "O brasil.json não mudou. Nada a commitar."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add painel/dados/brasil.json
          git commit -m "atualiza O Brasil ao longo do tempo ($(date -u +%Y-%m-%d))"
          git push
          echo "commitou=true" >> "$GITHUB_OUTPUT"

  publicar:
    needs: brasil
    if: needs.brasil.outputs.commitou == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Pedir a publicação e esperar o resultado
        run: |
          desde=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run publicar-cloudflare.yml --ref main
          id=
          for _ in $(seq 1 30); do
            id=$(gh run list --workflow publicar-cloudflare.yml --event workflow_dispatch \
                 --created ">=$desde" -L 1 --json databaseId -q '.[0].databaseId')
            [ -n "$id" ] && break
            sleep 10
          done
          if [ -z "$id" ]; then
            echo "::error::a publicação pedida não apareceu em 5 min"
            exit 1
          fi
          echo "Publicação: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$id"
          gh run watch "$id" --exit-status --interval 60

  # Vermelho de propósito, e por último: a coleta parcial já publicou o que
  # leu, e o vermelho é o que faz o GitHub avisar da série que ficou de fora.
  avisar:
    needs: [brasil, publicar]
    if: always() && needs.brasil.outputs.parcial == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Falhar porque alguma série ficou com o dado anterior
        run: |
          echo "::error::coleta parcial: o motivo está nas anotações do passo 'Ler as séries' do job brasil"
          exit 1
