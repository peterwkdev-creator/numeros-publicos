# Publica o site no Cloudflare Pages.
#
# Por que o build roda AQUI, e não na Cloudflare: o build do Pages tem teto de
# 20 minutos, e o mesmo site levou de 9 a 13 minutos na Vercel conforme a
# máquina. O GitHub Actions compila (repositório público, 6 horas por job) e
# envia o out/ pronto por Direct Upload, onde o teto não se aplica.
#
# Desde 27/09/2026 isto publica a produção (www.numerospublicos.com.br); a
# Vercel não serve mais o site. O noindex do cloudflare/_headers vale só
# para os endereços *.pages.dev. Ver especs/numeros-publicos-cloudflare.md
# no repositório da raiz.
#
# Segredos do repositório (criados pelo dono da conta, nunca versionados):
#   CLOUDFLARE_API_TOKEN   token de conta com permissão Cloudflare Pages: Edit
#   CLOUDFLARE_ACCOUNT_ID  o ID da conta
name: Publicar na Cloudflare

on:
  push:
    branches: [main]
    # Só o que muda o site. Commit que só mexe no Python ou nos registros não
    # publica.
    paths:
      - "painel/**"
      - "cloudflare/**"
      - ".github/workflows/publicar-cloudflare.yml"
  # Commit feito com o token do próprio Actions NÃO dispara `push`: as coletas
  # (IBGE e Caged) pedem a publicação por `workflow_dispatch`, e só quando
  # commitaram dado novo. Até 05/10/2026 havia aqui um `workflow_run` no fim
  # da coleta do IBGE, que republicava o mesmo site toda semana.
  workflow_dispatch:

# Um deploy por vez: dois pushes seguidos não podem publicar fora de ordem.
concurrency:
  group: publicar-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Versão e integridade no cloudflare/package-lock.json (desde 24/10/2026;
  # antes, `npx --yes wrangler@<versão>`, sem lockfile): o deploy não muda
  # de comportamento por baixo, e a versão nova chega por PR do Dependabot.
  # O caminho é relativo a `painel/`, o diretório dos passos.
  WRANGLER: ../cloudflare/node_modules/.bin/wrangler
  PROJETO: numeros-publicos

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: painel
    steps:
      # As actions vão pinadas pelo SHA do commit (17/10/2026), e não pela
      # tag: a tag `v7` se move, e quem a controla mudaria o que roda aqui com
      # o token da Cloudflare no ambiente. O comentário diz a versão do SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Este job não faz push: o token do GitHub não precisa ficar no
          # .git/config enquanto rodam o npm e o wrangler.
          persist-credentials: false
          # Sempre o último do main: a coleta pede a publicação depois do
          # commit dela, e o que se publica é esse commit.
          ref: main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            painel/package-lock.json
            cloudflare/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Os dois conferidores que leem o out/ inteiro e não pedem navegador.
      # Antes só rodavam à mão (atualizar-painel.py), e os crons do IBGE e do
      # Caged publicavam sem eles. Se um reprovar, o deploy não acontece.
      - name: Links internos do out/
        run: npm run conferir-links

      # O conferir-xlsx abre a planilha no LibreOffice, que é quem prova que
      # ela abre fora do nosso gerador. O runner não o traz instalado.
      - name: LibreOffice para abrir a planilha
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-calc-nogui
      - name: A planilha abre e bate com o CSV
        env:
          SOFFICE: soffice
        run: npm run conferir-xlsx

      # A auditoria (acessibilidade, 13 páginas em três modos) e a latência do
      # filtro da capa num navegador de verdade. Até 02/10/2026 só rodavam à
      # mão, e nada as chamava. O Chrome é o que o runner já traz; o
      # puppeteer-core e o serve vêm fixados no package-lock. O sysctl é o que
      # o Ubuntu 24.04 pede para o Chrome criar a sandbox sem ser root.
      - name: Auditoria e latência no navegador
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm run start > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8791/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:8791/ || { cat /tmp/serve.log; exit 1; }
          npm run auditar
          npm run medir-inp

      # A CSP do _headers contra as páginas que interagem, num navegador. Até
      # 17/10/2026 só rodava à mão, e o script-src deixou de aceitar inline
      # nesse dia: um <script> inline novo quebraria só no ar, em silêncio.
      - name: A CSP não bloqueia nada
        env:
          CHROME: /usr/bin/google-chrome
        run: npm run conferir-csp

      - name: Cabeçalhos do Pages
        run: cp ../cloudflare/_headers out/_headers && cp ../cloudflare/_redirects out/_redirects

      # Sem os scripts de instalação do esbuild e do workerd (allowScripts
      # vazio): o binário vem pelo pacote opcional da plataforma, e o
      # `pages deploy` não usa nenhum dos dois (conferido em 24/10/2026).
      - name: Wrangler do lockfile
        working-directory: cloudflare
        run: npm ci

      - name: O projeto existe (ou é criado)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if "$WRANGLER" pages project list | grep -qw "$PROJETO"; then
            echo "projeto $PROJETO já existe"
          else
            "$WRANGLER" pages project create "$PROJETO" --production-branch=main
          fi

      - name: Enviar o out/
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          "$WRANGLER" pages deploy out
          --project-name="$PROJETO"
          --branch=main
          --commit-hash="$(git rev-parse HEAD)"
